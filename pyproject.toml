[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-tools"
version = "0.1.0"
description = "PDF desktop tools for conversion and processing"
requires-python = ">=3.10"
dependencies = ["pdf2docx", "dearpygui==2.3.1", "pillow", "cairosvg", "pypdf", "cryptography", "PyMuPDF", "python-pptx"]

[tool.setuptools.packages.find]
include = ["pdf_tools*"]

[project.scripts]
pdf-tools = "pdf_tools.__main__:main"
pdf-tools-gui = "pdf_tools.gui_main:main"
